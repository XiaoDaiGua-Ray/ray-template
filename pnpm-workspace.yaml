# 检查命令保持只读；依赖安装由开发者或 CI 显式执行。
verifyDepsBeforeRun: false
overrides:
  # 上游仍限制旧大版本；这里只替换已核实使用的兼容 API，见升级记录。
  '@logicflow/core>uuid': 14.0.3
  'minimatch@>=10.0.0 <11.0.1': 11.0.4
  'glob@>=9.0.0 <14.0.2': 14.0.3
allowBuilds:
  # 发布包已包含构建产物，postinstall 仅输出 AI 提示，不参与应用构建。
  '@logicflow/core': false
  '@parcel/watcher': true
  esbuild: true
  rs-module-lexer: true
  vue-demi: true
minimumReleaseAgeExclude:
  - '@intlify/core-base@11.4.17'
  - '@intlify/devtools-types@11.4.17'
  - '@intlify/message-compiler@11.4.17'
  - '@intlify/shared@11.4.17'
  - globals@17.14.0
  - rollup-plugin-gzip@4.2.1
  - vue-i18n@11.4.17
  - minimatch@11.0.4
