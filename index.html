    <meta name="color-scheme" content="light dark" />
    <script>
      // 入口依赖可能在 main.ts 执行前失败；捕获不冒泡的模块加载错误和窗口求值错误。
      window.addEventListener(
        'error',
        function handleStartupError(event) {
          const splash = document.getElementById('pre-loading-animation')

          if (!splash) {
            window.removeEventListener('error', handleStartupError, true)
            return
          }

          if (
            event instanceof ErrorEvent ||
            (event.target instanceof HTMLScriptElement &&
              event.target.type === 'module')
          ) {
            splash.setAttribute('data-state', 'failed')
          }
        },
        true,
      )
      try {
        const settings = JSON.parse(
          localStorage.getItem('piniaSettingStore') ||
            'null',
        )
        document.documentElement.dataset.bootStyle = [
          'plain',
          'naive',
          'material',
        ].includes(settings?.themeStyle)
          ? settings.themeStyle
          : 'modern'
        const mode = settings?.appTheme
        if (mode !== 'auto') {
          const dark =
            mode === 'dark' || (mode == null && settings?._appTheme === true)
          document.documentElement.classList.add(
            dark ? 'r-template--dark' : 'r-template--light',
          )
        }
      } catch {}
      try {
        if (
          localStorage.getItem('localeLanguage') ===
          '"en-US"'
        ) {
          document.documentElement.lang = 'en-US'
        }
      } catch {}
    </script>

    <noscript>
      <main>
        <h1>Ray Admin - Vue 3 中后台管理模板</h1>
        <p>Ray Template 是基于 Vue 3、TypeScript（TSX）、Vite 和 Naive UI 的开源中后台管理模板，内置权限路由、响应式布局、数据表格和中英文切换。</p>

        </p>

    <div id="pre-loading-animation" class="ray-boot">
      <div class="ray-boot__content">
        <span class="ray-boot__brand">
          <img
            class="ray-boot__mark"
            src="/ray-template/ray.svg"
            width="48"
            height="48"
            alt=""
          />
        </span>
        <strong class="ray-boot__title">Ray Admin</strong>
        <div class="ray-boot__pending">
          <span class="ray-boot__track" aria-hidden="true"></span>
          <p class="ray-boot__label" id="ray-boot-label">
            <span lang="zh-CN">正在载入工作区</span>
            <span lang="en-US">Loading your workspace</span>
          </p>
          <progress aria-labelledby="ray-boot-label"></progress>
        </div>
        <div class="ray-boot__failure" role="alert">
          <p class="ray-boot__label">
            <span lang="zh-CN">工作区未能启动</span>
            <span lang="en-US">The workspace could not start</span>
          </p>
          <button
            class="ray-boot__retry"
            type="button"
            onclick="location.reload()"
          >
            <span lang="zh-CN">重新加载</span>
            <span lang="en-US">Reload</span>
          </button>
        </div>
      </div>
